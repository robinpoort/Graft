<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Graft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="sp-sr" data-i18n="appShortName">Graft</h1>

    <div class="sp-head">
      <img id="sp-favicon" class="sp-head__icon" alt="" width="16" height="16" hidden>
      <div class="sp-head__text">
        <strong id="sp-host"></strong>
        <span id="sp-summary"></span>
      </div>
      <button id="sp-rescan" class="sp-iconbtn" type="button" data-i18n-title="uiRescan" data-i18n-label="uiRescan" hidden>
        <svg class="sp-iconbtn__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M22.8752 8.99992H16.1252C15.6705 8.99992 15.258 8.72805 15.0846 8.30617C14.9111 7.8843 15.0049 7.40149 15.3283 7.07805L17.5174 4.88899C13.9877 2.14211 8.87832 2.39055 5.63457 5.6343C2.11895 9.14992 2.11895 14.8452 5.63457 18.3609C9.1502 21.8765 14.8455 21.8765 18.3611 18.3609C18.7455 17.9765 19.0877 17.5687 19.3877 17.1374C19.8611 16.4577 20.7986 16.2937 21.4783 16.7671C22.158 17.2405 22.3221 18.178 21.8486 18.8577C21.4502 19.4296 20.9955 19.9734 20.4846 20.4843C15.7971 25.1718 8.19863 25.1718 3.51582 20.4843C-1.16699 15.7968 -1.17168 8.20305 3.51582 3.51555C7.93613 -0.904763 14.9393 -1.1532 19.6549 2.75617L22.0783 0.32805C22.4018 0.00461235 22.8846 -0.0891377 23.3064 0.0842998C23.7283 0.257737 24.0002 0.670237 24.0002 1.12492V7.87492C24.0002 8.49836 23.4986 8.99992 22.8752 8.99992Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="sp-main">
    <div id="sp-error" class="sp-error" role="alert" hidden></div>

    <section class="sp-panel" id="sp-access" aria-labelledby="sp-accesshead" hidden>
      <h2 class="sp-section__head" id="sp-accesshead" data-i18n="uiAccessHead">Permission first</h2>
      <p class="sp-note sp-note--lead" data-i18n="uiAccessNote"></p>
      <button class="sp-btn" id="sp-allow" type="button" data-i18n="uiAccessAllow">Allow</button>
    </section>

    <section class="sp-panel" id="sp-files" hidden>
      <div id="sp-groups"></div>
      <p class="sp-note" id="sp-empty" data-i18n="uiEmpty" hidden></p>
      <div class="sp-panelfoot" id="sp-hint" hidden>
        <p class="sp-note" data-i18n="uiHint"></p>
      </div>
    </section>

    <p class="sp-sr" id="sp-status" role="status"></p>
  </main>

  <footer class="sp-foot">
    <span class="sp-foot__name">
      <img class="sp-foot__logo" src="icons/icon16.png" alt="" width="16" height="16">
      <span data-i18n="appShortName">Graft</span>
    </span>
    <a class="sp-foot__link" id="sp-author" target="_blank" rel="noreferrer">Robin Poort</a>
  </footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
